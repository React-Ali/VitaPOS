appId: com.vitapos.app
productName: VitaPOS
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VitaPOS
  license: build/license.txt  # <-- Make sure this path matches exactly
  deleteAppDataOnUninstall: false